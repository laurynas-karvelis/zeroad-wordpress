name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php-version: ["7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", latest]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zeroad-wordpress

      # The bootstrap uses the PHP SDK 1.0.0 source and signing fixtures.
      - name: Checkout PHP SDK and test tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: laurynas-karvelis/zeroad-token-php
          ref: eab87fb4c24122b280bb636f76ed154e9fcd0bee # 1.0.0
          path: zeroad-token-php

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sodium, apcu
          ini-values: apc.enable_cli=1
          coverage: none
          tools: composer:v2

      - name: Install test tools
        working-directory: zeroad-token-php
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run plugin unit tests against SDK source
        working-directory: zeroad-wordpress/plugins/zero-ad-network
        run: ../../../zeroad-token-php/vendor/bin/phpunit -c phpunit.xml
